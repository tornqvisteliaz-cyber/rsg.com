<!doctype html><html><head><title>Publish newsletter</title><link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"></head><body class="bg-light"><main class="container" style="max-width:700px;margin-top:50px"><div class="card card-body"><h1 class="h3">Publish newsletter update</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title</label><input class="form-control mb-3" name="title" required><label>Content</label><textarea class="form-control mb-3" name="content" rows="8" required></textarea><label>Image (optional)</label><input class="form-control-file mb-3" type="file" name="image" accept="image/png,image/jpeg,image/gif"><button class="btn btn-dark">Publish</button><a class="btn btn-link" href="{{ url_for('views.newsletter') }}">Cancel</a></form></div></main></body></html>
