<!doctype html><html><head><title>{{ post.title }} | Rotaidem</title><link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"><style>
        .site-navbar { position: sticky; top: 0; z-index: 1030; background: #fff; }
        .site-navbar .navbar-collapse { display: flex !important; flex-basis: auto; align-items: center; }
        .site-navbar .navbar-nav { flex-direction: row; flex-wrap: wrap; }
        .site-navbar .nav-link { white-space: nowrap; }
        .admin-navbar { position: sticky; top: 0; z-index: 1030; flex-wrap: wrap; }
        .admin-navbar .navbar-nav { flex-direction: row; flex-wrap: wrap; }
</style>
</head><body><main class="container py-5"><a href="{{ url_for('views.newsletter') }}">← Newsletter</a><h1 class="mt-3">{{ post.title }}</h1><p class="text-muted">By {{ post.author }} · {{ post.date_posted.strftime('%Y-%m-%d') }}</p>{% if post.image_filename %}<img class="img-fluid mb-4" src="{{ url_for('static',filename='uploads/' + post.image_filename) }}" alt="">{% endif %}<p style="white-space:pre-wrap">{{ post.content }}</p></main></body></html>
