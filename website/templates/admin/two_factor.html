{% extends 'admin/base.html' %}{% block content %}<h1>Two-factor authentication</h1><p>Add this account to any TOTP authenticator using the setup key below, then enter the 6-digit code to enable it.</p><div class="alert alert-secondary"><code>{{ secret }}</code></div><small class="text-muted d-block mb-3">{{ uri }}</small><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-3" name="code" inputmode="numeric" placeholder="6-digit code" required><button class="btn btn-primary">Enable 2FA</button></form>{% endblock %}
