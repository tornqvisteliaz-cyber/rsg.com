{% extends 'admin/base.html' %}{% block content %}<h1>Edit {{ user.username }}</h1><form method="post" class="card card-body mb-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-2" type="email" name="email" value="{{ user.email }}" required><select class="form-control mb-3" name="role">{% for role in ['Support','Admin','Owner'] %}<option {% if user.role==role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select><button class="btn btn-primary">Save</button></form><form method="post" action="{{ url_for('admin.reset_admin_password',id=user.id) }}" class="card card-body"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2 class="h5">Reset password</h2><input class="form-control mb-2" type="password" name="password" minlength="12" placeholder="New password" required><button class="btn btn-warning">Reset password and end sessions</button></form>{% endblock %}
