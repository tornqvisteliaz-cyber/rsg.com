{% extends "admin/base.html" %}
{% block title %}New Newsletter Post | RSG Admin{% endblock %}

{% block content %}
<h1 class="h3 mb-4">New Newsletter Post</h1>

<form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" class="form-control" required>
    </div>

    <div class="form-group">
        <label>Content</label>
        <textarea name="content" class="form-control" rows="8" required></textarea>
    </div>

    <div class="form-group">
        <label>Image (optional)</label>
        <input type="file" name="image" class="form-control-file" accept="image/*">
        <small class="text-muted">JPG, PNG or GIF – max 5 MB</small>
    </div>

    <button type="submit" class="btn btn-dark">Publish</button>
    <a href="{{ url_for('admin.newsletter_list') }}" class="btn btn-outline-secondary ml-2">Cancel</a>
</form>
{% endblock %}
