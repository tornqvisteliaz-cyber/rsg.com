{% extends 'admin/base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Admin accounts</h1><a class="btn btn-primary" href="{{ url_for('admin.create_admin') }}">Add admin</a></div><table class="table bg-white mt-3"><tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>{% for user in users %}<tr><td>{{ user.username }}</td><td>{{ user.email }}</td><td>{{ user.role }}</td><td>{{ 'Active' if user.enabled else 'Disabled' }}</td><td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('admin.edit_admin',id=user.id) }}">Edit</a><form class="d-inline" method="post" action="{{ url_for('admin.toggle_admin',id=user.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-warning">{{ 'Disable' if user.enabled else 'Enable' }}</button></form><form class="d-inline" method="post" action="{{ url_for('admin.delete_admin',id=user.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
