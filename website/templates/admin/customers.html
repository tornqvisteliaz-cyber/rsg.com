{% extends 'admin/base.html' %}{% block content %}<h1>Customers</h1><form class="mb-3"><input class="form-control" name="search" value="{{ search }}" placeholder="Name or email"></form><table class="table bg-white"><tr><th>Name</th><th>Email</th><th>Created</th><th>Status</th><th></th></tr>{% for customer in customers %}<tr><td>{{ customer.name }}</td><td>{{ customer.email }}</td><td>{{ customer.created_at }}</td><td>{{ 'Banned' if customer.banned else 'Active' }}</td><td><a class="btn btn-sm btn-primary" href="{{ url_for('admin.customer_detail',id=customer.id) }}">View</a></td></tr>{% else %}<tr><td colspan="5">No customers found.</td></tr>{% endfor %}</table>{% endblock %}
