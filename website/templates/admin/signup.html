<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create owner account | RSG Software</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 mt-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-4">Create owner account</h1>
                        <form method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input id="username" class="form-control" name="username" required autocomplete="username">
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input id="email" type="email" class="form-control" name="email" required autocomplete="email">
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input id="password" type="password" class="form-control" name="password" required autocomplete="new-password">
                            </div>
                            <button class="btn btn-dark btn-block" type="submit">Create owner account</button>
                        </form>
                        <p class="mt-3 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
