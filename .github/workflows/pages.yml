name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, master, claude/lucid-tesla-liazv2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static preview
        run: |
          # Pages serves the site under /<repo>/, so prefix root-relative links.
          BASE="/${GITHUB_REPOSITORY#*/}"
          cp -r cloudflare/public _site
          rm -f _site/_routes.json
          find _site -name '*.html' -o -name '*.js' | xargs sed -i -E "s#([\"'(=])/([a-zA-Z0-9_\#?-]|\")#\1${BASE}/\2#g"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
