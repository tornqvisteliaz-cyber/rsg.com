name: Deploy preview to GitHub Pages

# Publishes cloudflare/public to the gh-pages branch.
# In Settings → Pages choose "Deploy from a branch" → gh-pages / (root).
on:
  push:
    branches: [main, master, claude/lucid-tesla-liazv2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static preview
        run: |
          # Pages serves the site under /<repo>/, so prefix root-relative links.
          BASE="/${GITHUB_REPOSITORY#*/}"
          cp -r cloudflare/public _site
          rm -f _site/_routes.json
          find _site -name '*.html' -o -name '*.js' | xargs sed -i -E "s#([\"'(=])/([a-zA-Z0-9_\#?-]|\")#\1${BASE}/\2#g"
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
