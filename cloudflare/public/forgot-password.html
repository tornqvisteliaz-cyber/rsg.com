<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password | Rotaidem</title>
    <meta name="description" content="Reset the password of your Rotaidem account.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/site.css">
</head>
<body data-footer="off">
<main class="auth">
    <div class="auth-side" data-image="login" style="background-image:url('/img/clouds.jpg')"><div><h2>Locked out?</h2><p>It happens. We will email you a link to choose a new password.</p></div></div>
    <div class="auth-form">
        <form id="form">
            <h1 style="font-size:32px">Forgot password</h1>
            <p class="muted" style="margin-bottom:26px">Enter the email address or username of your account and we will send you a link to reset your password.</p>
            <div class="field"><label for="email">Email or username</label><input id="email" autocomplete="username" required></div>
            <button class="btn btn-block" id="send">Send reset link</button>
            <p id="msg" class="msg"></p>
            <p class="alt-link">Remembered it? <a href="/login">Back to log in</a></p>
        </form>
    </div>
</main>
<script src="/auth.js"></script>
<script>
const $ = id => document.getElementById(id);
$("form").onsubmit = async e => {
    e.preventDefault();
    const msg = $("msg"); msg.className = "msg"; msg.textContent = "Sending…";
    $("send").disabled = true;
    const res = await fetch("/api/password/forgot", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: $("email").value }) }).catch(() => null);
    const data = res ? await res.json().catch(() => ({})) : {};
    $("send").disabled = false;
    if (!res || !res.ok) { msg.className = "msg error"; msg.textContent = data.error || "This is not available right now. Please try again later."; return; }
    msg.className = "msg ok"; msg.textContent = data.message;
    $("send").textContent = "Send again";
};
</script>
</body>
</html>
