<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Addon | Rotaidem</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/site.css">
    <style>.shot { width: 100%; height: 70vh; object-fit: cover; display: block; background: #111; } .sheet { background: #fff; color: #111; padding: 48px 20px 80px; } .inner { max-width: 980px; margin: 0 auto; } .buy { background: #111; color: #fff; padding: 12px 22px; display: inline-block; font-weight: 700; } .gallery img { width: 100%; height: 220px; object-fit: cover; }</style>
</head>
<body>
<nav class="navbar rotaidem-nav"><div class="container"><a class="navbar-brand" href="/"><img src="/images/mark.jpg" alt=""> Rotaidem</a><ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="/">Home</a></li><li class="nav-item"><a class="nav-link" href="/addons">Addons</a></li><li class="nav-item"><a class="nav-link" href="/about">About</a></li><li class="nav-item"><a class="nav-link" href="/work-at-rsg">Work</a></li><li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li><li class="nav-item"><a class="nav-link" href="/newsletter">Newsletter</a></li></ul><div id="auth-buttons"></div></div></nav>
<img id="hero" class="shot" src="/images/seabee-water.jpg" alt="">
<div class="sheet"><div class="inner">
    <a href="/addons">Back to addons</a>
    <p class="text-muted mt-4 mb-1" id="meta">MSFS 2024</p>
    <h1 id="title">Addon</h1>
    <p id="description"></p>
    <p id="price" style="font-size:28px"></p>
    <a id="buy" class="buy" href="mailto:Collab@rsgsoftware.se">Buy here</a>
    <h3 class="mt-5">Gallery</h3>
    <div class="row gallery" id="gallery"></div>
</div></div>
<script src="/auth.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id") || "seabee";
const fallback = { id: "seabee", name: "Republic RC-3 Seabee", price: "$29.99", description: "Amphibious flying boat for Microsoft Flight Simulator 2024. Water and land operations, custom systems and sound.", image_url: "/images/seabee-water.jpg", images: ["/images/seabee-dock.jpg", "/images/cockpit.jpg"], status: "in_development", simulator: "MSFS 2024" };
function show(item) {
    document.title = item.name + " | Rotaidem";
    document.getElementById("title").textContent = item.name;
    document.getElementById("description").textContent = item.description || "";
    document.getElementById("price").textContent = item.price || "";
    document.getElementById("meta").textContent = (item.simulator || "MSFS 2024") + " · " + (item.status || "in_development");
    const hero = item.image_url || (item.images && item.images[0]) || fallback.image_url;
    document.getElementById("hero").src = hero;
    const buy = document.getElementById("buy");
    if (item.buy_url && !item.buy_url.includes("/addons/view")) buy.href = item.buy_url;
    const images = [hero].concat(item.images || []).filter((url, index, list) => url && list.indexOf(url) === index);
    document.getElementById("gallery").innerHTML = images.map(url => `<div class="col-md-4 mb-3"><img src="${url}" alt=""></div>`).join("");
}
fetch("/api/products").then(r => r.json()).then(data => show((data.products || []).find(p => p.id === id) || fallback)).catch(() => show(fallback));
</script>
</body>
</html>
