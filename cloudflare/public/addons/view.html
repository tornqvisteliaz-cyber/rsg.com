<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Addon | Rotaidem</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/site.css">
    <style>.shot { width: 100%; height: 70vh; object-fit: cover; display: block; background: #111; } .sheet { background: #fff; color: #111; padding: 48px 20px 80px; } .inner { max-width: 980px; margin: 0 auto; } .buy { background: #111; color: #fff; padding: 12px 22px; display: inline-block; font-weight: 700; } .gallery img { width: 100%; height: 220px; object-fit: cover; background: #eee; }</style>
</head>
<body>
<nav class="navbar rotaidem-nav"><div class="container"><a class="navbar-brand" href="/"><img src="https://i.postimg.cc/rwKST91B/rsgsoftware.png" alt=""> Rotaidem</a><ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="/">Home</a></li><li class="nav-item"><a class="nav-link" href="/addons/">Addons</a></li><li class="nav-item"><a class="nav-link" href="/about">About</a></li><li class="nav-item"><a class="nav-link" href="/work-at-rsg">Work</a></li><li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li><li class="nav-item"><a class="nav-link" href="/newsletter">Newsletter</a></li></ul><div id="auth-buttons"></div></div></nav>
<img id="hero" class="shot" src="https://i.postimg.cc/28WybSM2/metroliner.jpg" alt="">
<div class="sheet"><div class="inner">
    <a href="/addons/">Back to addons</a>
    <p class="text-muted mt-4 mb-1" id="meta">MSFS 2024</p>
    <h1 id="title">Addon</h1>
    <p id="description"></p>
    <p id="price" style="font-size:28px"></p>
    <a id="buy" class="buy" href="mailto:Eliaz@rotaidem.com">Buy here</a>
    <h3 class="mt-5">Gallery</h3>
    <div class="row gallery" id="gallery"></div>
</div></div>
<script src="/auth.js"></script>
<script>
const FALLBACK = "https://i.postimg.cc/28WybSM2/metroliner.jpg";
const id = new URLSearchParams(location.search).get("id") || "";
function safeImage(url) { return /^https?:\/\/.+\..+/.test(url || "") ? url : FALLBACK; }
function show(item) {
    document.title = item.name + " | Rotaidem";
    document.getElementById("title").textContent = item.name;
    document.getElementById("description").textContent = item.description || "";
    document.getElementById("price").textContent = item.price || "";
    document.getElementById("meta").textContent = (item.simulator || "MSFS 2024") + " · " + (item.status || "");
    const hero = safeImage(item.image_url);
    document.getElementById("hero").src = hero;
    const buy = document.getElementById("buy");
    if (item.buy_url && /^https?:\/\//.test(item.buy_url)) buy.href = item.buy_url;
    else if (item.buy_url && item.buy_url.startsWith("mailto:")) buy.href = "mailto:Eliaz@rotaidem.com";
    const images = [hero].concat((item.images || []).map(safeImage)).filter((url, index, list) => url && list.indexOf(url) === index);
    document.getElementById("gallery").innerHTML = images.map(url => `<div class="col-md-4 mb-3"><img src="${url}" alt=""></div>`).join("");
}
fetch("/api/products").then(r => r.json()).then(data => {
    const item = (data.products || []).find(p => p.id === id);
    if (!item) { document.getElementById("title").textContent = "Addon not found"; return; }
    show(item);
}).catch(() => { document.getElementById("title").textContent = "Could not load addon"; });
</script>
</body>
</html>
