<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | RSG Software</title><link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark"><a class="navbar-brand" href="/admin">RSG Admin</a><a class="text-white ml-3" href="/">Website</a></nav>
<main class="container py-4"><h1>Catalog</h1><p id="status" class="text-danger"></p>
<div class="card p-3 mb-4"><h3>Aircraft</h3><input id="p-name" class="form-control mb-2" placeholder="Name"><input id="p-image" class="form-control mb-2" placeholder="Image URL"><input id="p-price" class="form-control mb-2" placeholder="Price"><input id="p-version" class="form-control mb-2" placeholder="Version"><input id="p-folder" class="form-control mb-2" placeholder="Folder name"><input id="p-url" class="form-control mb-2" placeholder="Download URL"><input id="p-buy" class="form-control mb-2" placeholder="Buy URL"><textarea id="p-desc" class="form-control mb-2" placeholder="Description"></textarea><button class="btn btn-dark" onclick="saveProduct()">Save aircraft</button><p id="p-msg"></p></div>
<div class="card p-3 mb-4"><h3>Newsletter</h3><input id="n-title" class="form-control mb-2" placeholder="Title"><input id="n-image" class="form-control mb-2" placeholder="Image URL"><textarea id="n-content" class="form-control mb-2" placeholder="Content"></textarea><button class="btn btn-dark" onclick="savePost()">Post</button><p id="n-msg"></p></div><div id="list"></div></main>
<script>function headers(){return{'content-type':'application/json',Authorization:'Bearer '+(localStorage.getItem('rsg_token')||'')}}async function saveProduct(){const res=await fetch('/api/save-product',{method:'POST',headers:headers(),body:JSON.stringify({name:document.getElementById('p-name').value,image_url:document.getElementById('p-image').value,price:document.getElementById('p-price').value,version:document.getElementById('p-version').value,folder_name:document.getElementById('p-folder').value,download_url:document.getElementById('p-url').value,buy_url:document.getElementById('p-buy').value,description:document.getElementById('p-desc').value})});const data=await res.json();document.getElementById('p-msg').textContent=res.ok?'Saved.':(data.error||'Save failed');load()}async function savePost(){const res=await fetch('/api/newsletter',{method:'POST',headers:headers(),body:JSON.stringify({title:document.getElementById('n-title').value,image_url:document.getElementById('n-image').value,content:document.getElementById('n-content').value})});const data=await res.json();document.getElementById('n-msg').textContent=res.ok?'Posted.':(data.error||'Could not post')}async function load(){const res=await fetch('/api/products',{headers:headers()});if(!res.ok){document.getElementById('status').textContent='Log in as admin first.';return}const data=await res.json();document.getElementById('list').innerHTML=(data.products||[]).map(p=>`<div class="border-bottom py-2">${p.name} · ${p.price||''}</div>`).join('')}if(localStorage.getItem('rsg_admin')!=='true')location.href='/login';load();</script></body></html>
