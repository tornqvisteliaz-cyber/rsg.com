<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Rotaidem</title>
    <meta name="description" content="Get in touch with Rotaidem.">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/rwKST91B/rsgsoftware.png">
    <link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="hero hero-short" style="background-image:url('https://i.postimg.cc/28WybSM2/metroliner.jpg')">
    <div class="wrap"><span class="eyebrow">Contact</span><h1 class="title-xl">Say hello</h1><p class="lead">Support, partnerships or a wild addon idea. We read every message.</p></div>
</header>
<section class="section"><div class="wrap split" style="align-items:start">
    <div>
        <div class="card" style="margin-bottom:20px"><h3>General &amp; support</h3><p class="muted">Product questions, support and partnerships.</p><a href="mailto:Eliaz@rotaidem.com">Eliaz@rotaidem.com</a></div>
        <div class="card"><h3>Work with us</h3><p class="muted">Creators of aircraft, art or sound are always welcome.</p><a href="/work-at-rsg">See careers</a></div>
    </div>
    <form class="card" id="contact-form">
        <h3>Send a message</h3>
        <div class="field"><label for="cname">Name</label><input id="cname" required></div>
        <div class="field"><label for="cemail">Email</label><input id="cemail" type="email" required></div>
        <div class="field"><label for="cmessage">Message</label><textarea id="cmessage" rows="6" required></textarea></div>
        <button class="btn">Send message</button>
        <p id="cstatus" class="msg"></p>
    </form>
</div></section>
<script src="/auth.js"></script>
<script>
document.getElementById("contact-form").onsubmit = async e => {
    e.preventDefault();
    const status = document.getElementById("cstatus");
    const res = await fetch("/api/contact", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: document.getElementById("cname").value, email: document.getElementById("cemail").value, message: document.getElementById("cmessage").value }) });
    status.className = "msg " + (res.ok ? "ok" : "error");
    status.textContent = res.ok ? "Thanks! Your message was sent." : "Could not send. Please email us instead.";
    if (res.ok) e.target.reset();
};
</script>
</body>
</html>
