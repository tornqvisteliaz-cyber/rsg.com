<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Rotaidem</title>
    <meta name="description" content="Contact Rotaidem.">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/rwKST91B/rsgsoftware.png">
    <link rel="stylesheet" href="/site.css">
</head>
<body>
<section class="page-head" style="background-image:url('https://i.postimg.cc/28WybSM2/metroliner.jpg')"><div class="wrap"><div class="crumbs"><a href="/">Home</a> / Contact</div><h1>Contact</h1><p>Questions about our products, support or partnerships.</p></div></section>
<section class="section"><div class="wrap split" style="align-items:start">
    <div>
        <h2>Reach us</h2>
        <table class="table"><tbody>
            <tr><td class="muted">General and support</td><td><a href="mailto:Eliaz@rotaidem.com">Eliaz@rotaidem.com</a></td></tr>
            <tr><td class="muted">Help and FAQ</td><td><a href="/support">Support page</a></td></tr>
            <tr><td class="muted">Careers</td><td><a href="/work-at-rsg">Careers page</a></td></tr>
        </tbody></table>
    </div>
    <form class="box" id="contact-form">
        <h3>Send a message</h3>
        <div class="field"><label for="cname">Name</label><input id="cname" required></div>
        <div class="field"><label for="cemail">Email</label><input id="cemail" type="email" required></div>
        <div class="field"><label for="cmessage">Message</label><textarea id="cmessage" rows="6" required></textarea></div>
        <button class="btn">Send message</button>
        <p id="cstatus" class="msg"></p>
    </form>
</div></section>
<script src="/auth.js"></script>
<script>
document.getElementById("contact-form").onsubmit = async e => {
    e.preventDefault();
    const st = document.getElementById("cstatus");
    const res = await fetch("/api/contact", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: document.getElementById("cname").value, email: document.getElementById("cemail").value, message: document.getElementById("cmessage").value }) }).catch(() => null);
    st.className = "msg " + (res && res.ok ? "ok" : "error");
    st.textContent = res && res.ok ? "Thank you. We will get back to you soon." : "The message could not be sent. Please email us instead.";
    if (res && res.ok) e.target.reset();
};
</script>
</body>
</html>
