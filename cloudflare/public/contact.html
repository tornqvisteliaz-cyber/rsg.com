<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact | RSG Software</title><link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"></head>
<body><nav class="navbar navbar-light bg-white border-bottom"><div class="container"><a class="navbar-brand" href="/"><strong>RSG</strong> Software</a><div id="auth-buttons"></div></div></nav>
<div class="container py-5" style="max-width:720px"><h1>Contact</h1><p>Questions about the Seabee, collaborations or support.</p><p><strong>General:</strong> <a href="mailto:Collab@rsgsoftware.se">Collab@rsgsoftware.se</a></p><p><strong>Careers:</strong> <a href="mailto:careers@rsgsoftware.site">careers@rsgsoftware.site</a></p>
<form id="contact-form" class="mt-4"><input class="form-control mb-3" id="cname" placeholder="Name" required><input class="form-control mb-3" id="cemail" type="email" placeholder="Email" required><textarea class="form-control mb-3" id="cmessage" rows="5" placeholder="Message" required></textarea><button class="btn btn-dark">Send</button><p id="cstatus" class="mt-3"></p></form></div>
<script src="/auth.js"></script><script>document.getElementById('contact-form').onsubmit=async(e)=>{e.preventDefault();const status=document.getElementById('cstatus');const res=await fetch('/api/contact',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.getElementById('cname').value,email:document.getElementById('cemail').value,message:document.getElementById('cmessage').value})});status.textContent=res.ok?'Message saved.':'Could not send.';};</script></body></html>
