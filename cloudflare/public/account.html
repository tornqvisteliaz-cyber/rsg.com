<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My account | Rotaidem</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/site.css">
</head>
<body>
<main class="section">
    <div class="wrap">
        <h1 id="welcome">My account</h1>
        <p class="muted" id="email-line">Loading account…</p>

        <div class="grid grid-3" style="margin:36px 0">
            <div class="card"><label class="muted">Orders</label><div class="stat-num" id="order-count">0</div></div>
            <div class="card"><label class="muted">Account type</label><div class="stat-num" style="font-size:32px" id="role">Customer</div></div>
            <div class="card"><label class="muted">Licence</label><div class="stat-num" style="font-size:32px">Personal</div></div>
        </div>

        <div class="split" style="align-items:start">
            <div>
                <div class="box" style="padding:0;margin-bottom:24px">
                    <h3 style="padding:24px 24px 0">Order history</h3>
                    <div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Product</th><th>Payment</th><th>Amount</th><th>Date</th></tr></thead><tbody id="orders"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody></table></div>
                </div>
            </div>
            <form class="box" id="settings-form">
                <h3>Settings</h3>
                <div class="field"><label for="s-name">Name</label><input id="s-name" required></div>
                <div class="field"><label for="s-cur">Current password</label><input id="s-cur" type="password" placeholder="Only needed to change password" autocomplete="current-password"></div>
                <div class="field"><label for="s-new">New password</label><input id="s-new" type="password" minlength="6" placeholder="At least 6 characters" autocomplete="new-password"></div>
                <button class="btn">Save changes</button>
                <p class="msg" id="s-msg"></p>
            </form>
        </div>
    </div>
</main>
<script src="/auth.js"></script>
<script>
const token = localStorage.getItem("rsg_token");
if (!token) location.href = "/login";
const headers = { "content-type": "application/json", Authorization: "Bearer " + token };

async function init() {
    const res = await fetch("/api/me", { headers });
    if (res.status === 401) { rsgLogout(); return; }
    const { user } = await res.json();
    document.getElementById("welcome").textContent = "Welcome, " + user.name;
    document.getElementById("email-line").textContent = user.email;
    document.getElementById("role").textContent = user.role;
    document.getElementById("order-count").textContent = user.orders_count;
    document.getElementById("s-name").value = user.name;

    const orders = (await (await fetch("/api/account/orders", { headers })).json()).orders || [];
    document.getElementById("orders").innerHTML = orders.length ? orders.map(o =>
        `<tr><td>#${esc(o.id)}</td><td>${esc(o.product_id || "-")}</td><td>${esc(o.payment_status)}</td><td>$${Number(o.amount || 0).toFixed(2)}</td><td class="muted">${esc(String(o.created_at || "").slice(0, 10))}</td></tr>`
    ).join("") : '<tr><td colspan="5" class="muted">No orders yet.</td></tr>';
}

document.getElementById("settings-form").onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById("s-msg");
    const res = await fetch("/api/account/settings", { method: "POST", headers, body: JSON.stringify({
        name: document.getElementById("s-name").value,
        current_password: document.getElementById("s-cur").value,
        new_password: document.getElementById("s-new").value
    })});
    const data = await res.json().catch(() => ({}));
    msg.className = "msg " + (res.ok ? "ok" : "error");
    msg.textContent = res.ok ? "Saved." : (data.error || "Could not save.");
    if (res.ok) { localStorage.setItem("rsg_name", data.name); document.getElementById("s-cur").value = ""; document.getElementById("s-new").value = ""; init(); paintAuth(); }
};
init();
</script>
</body>
</html>
