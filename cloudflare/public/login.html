<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | RSG Software</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container" style="max-width: 460px; margin-top: 80px;">
    <div class="card shadow">
        <div class="card-body p-4 text-center">
            <img src="https://i.postimg.cc/rwKST91B/rsgsoftware.png" alt="RSG" style="width: 180px;">
            <h3 class="my-3">Login</h3>
            <input id="email" class="form-control mb-3" placeholder="Email or admin username">
            <input id="password" type="password" class="form-control mb-3" placeholder="Password">
            <button class="btn btn-dark btn-block" onclick="login()">Login</button>
            <p id="error" class="text-danger mt-3"></p>
            <a href="/signup">Create an account</a>
        </div>
    </div>
</div>
<script>
async function login() {
    const error = document.getElementById('error');
    error.textContent = 'Signing in...';
    const res = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    })});
    const data = await res.json();
    if (!res.ok) { error.textContent = data.error || 'Login failed'; return; }
    localStorage.setItem('rsg_token', data.token);
    localStorage.setItem('rsg_name', data.name || '');
    localStorage.setItem('rsg_admin', data.is_admin ? 'true' : 'false');
    location.href = data.is_admin ? '/admin' : '/';
}
</script>
</body>
</html>
