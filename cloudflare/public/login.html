<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Rotaidem</title>
    <meta name="description" content="Log in to your Rotaidem account.">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/rwKST91B/rsgsoftware.png">
    <link rel="stylesheet" href="/site.css">
</head>
<body data-footer="off">
<main class="auth-page">
    <form class="auth-card" id="login-form">
        <span class="eyebrow">Welcome back</span>
        <h1 class="title-lg" style="font-size:36px">Log in</h1>
        <div class="field"><label for="email">Email or username</label><input id="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-block">Log in</button>
        <p id="error" class="msg"></p>
        <p class="muted" style="font-size:14px">No account? <a href="/signup">Create one</a></p>
    </form>
</main>
<script src="/auth.js"></script>
<script>
document.getElementById("login-form").onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById("error");
    msg.className = "msg"; msg.textContent = "Signing in…";
    const res = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { msg.className = "msg error"; msg.textContent = data.error || "Login failed"; return; }
    saveSession(data);
    location.href = data.is_admin ? "/admin" : "/account";
};
</script>
</body>
</html>
