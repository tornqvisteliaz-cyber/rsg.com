<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Newsletter | Rotaidem</title><link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"><link rel="stylesheet" href="/site.css"></head>
<body class="bg-light"><nav class="navbar rotaidem-nav"><div class="container"><a class="navbar-brand" href="/"><img src="/images/mark.jpg" alt=""> Rotaidem</a><ul class="navbar-nav"><li class="nav-item"><a class="nav-link" href="/">Home</a></li><li class="nav-item"><a class="nav-link" href="/addons">Addons</a></li><li class="nav-item"><a class="nav-link" href="/about">About</a></li><li class="nav-item"><a class="nav-link" href="/work-at-rsg">Work</a></li><li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li><li class="nav-item"><a class="nav-link" href="/newsletter">Newsletter</a></li></ul><div id="auth-buttons"></div></div></nav>
<header class="hero-band" style="background-image: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url('/images/seabee-dock.jpg');"><div class="container pb-5"><h1 class="display-4 font-weight-bold">Newsletter</h1></div></header>
<div class="container py-5"><div id="posts" class="fun-card"></div></div>
<footer class="py-4 text-center"><a href="/terms" class="mr-3">Terms</a><a href="/privacy">Privacy</a></footer>
<script src="/auth.js"></script><script>fetch('/api/newsletter').then(r=>r.json()).then(data=>{const posts=data.posts||[];document.getElementById('posts').innerHTML=posts.length?posts.map(p=>`<article class="mb-4"><h3>${p.title}</h3><p class="text-muted">${p.date||''}</p>${p.image_url?`<img src="${p.image_url}" class="img-fluid mb-3">`:''}<p>${p.content}</p></article>`).join(''):'<p>No posts yet.</p>';});</script></body></html>
