<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Newsletter | RSG Software</title><link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"></head>
<body><nav class="navbar navbar-light bg-white border-bottom"><div class="container"><a class="navbar-brand" href="/"><strong>RSG</strong> Software</a><div id="auth-buttons"></div></div></nav>
<div class="container py-5"><h1>Newsletter</h1><div id="posts" class="mt-4"></div></div>
<script src="/auth.js"></script><script>fetch('/api/newsletter').then(r=>r.json()).then(data=>{const posts=data.posts||[];document.getElementById('posts').innerHTML=posts.length?posts.map(p=>`<article class="mb-4"><h3>${p.title}</h3><p class="text-muted">${p.date||''}</p>${p.image_url?`<img src="${p.image_url}" class="img-fluid mb-3">`:''}<p>${p.content}</p></article>`).join(''):'<p>No posts yet.</p>';});</script></body></html>
