<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password | Rotaidem</title>
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/site.css">
    <script src="/site-settings.js"></script>
</head>
<body data-footer="off">
<main class="auth">
    <div class="auth-side" data-image="login" style="background-image:url('/img/clouds.jpg')"><div><h2>Almost there</h2><p>Choose a new password and you are back in your account.</p></div></div>
    <div class="auth-form">
        <form id="form">
            <h1 style="font-size:32px">New password</h1>
            <p class="muted" id="intro" style="margin-bottom:26px">Checking your link…</p>
            <div id="fields" hidden>
                <div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div>
                <div class="field"><label for="password2">Type it again</label><input id="password2" type="password" autocomplete="new-password" minlength="6" required></div>
                <button class="btn btn-block" id="save">Save password and log in</button>
            </div>
            <p id="msg" class="msg"></p>
            <p class="alt-link"><a href="/forgot-password">Ask for a new link</a> · <a href="/login">Back to log in</a></p>
        </form>
    </div>
</main>
<script src="/auth.js"></script>
<script>
const $ = id => document.getElementById(id);
// Keep the token out of the address bar (and browser history) once it has been read; the tab
// remembers it so a reload still works.
let token = new URLSearchParams(location.search).get("token") || "";
try { if (token) sessionStorage.setItem("rsg_reset", token); else token = sessionStorage.getItem("rsg_reset") || ""; } catch (err) {}
if (location.search) history.replaceState(null, "", location.pathname);
const post = (path, body) => fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then(async r => ({ ok: r.ok, data: await r.json().catch(() => ({})) })).catch(() => ({ ok: false, data: {} }));
function fail(text) { $("intro").textContent = "This link cannot be used."; $("fields").hidden = true; $("msg").className = "msg error"; $("msg").textContent = text; }
(async () => {
    if (!token) return fail("The link is incomplete. Open it straight from the email, or ask for a new one.");
    const r = await post("/api/password/check", { token });
    if (!r.ok) return fail(r.data.error || "This link cannot be checked right now. Please try again later.");
    $("intro").textContent = `Choose a new password for ${r.data.email}. At least 6 characters.`;
    $("fields").hidden = false;
    $("password").focus();
})();
$("form").onsubmit = async e => {
    e.preventDefault();
    const msg = $("msg");
    if ($("password").value !== $("password2").value) { msg.className = "msg error"; msg.textContent = "The two passwords are not the same."; return; }
    msg.className = "msg"; msg.textContent = "Saving…"; $("save").disabled = true;
    const r = await post("/api/password/reset", { token, password: $("password").value });
    $("save").disabled = false;
    if (!r.ok) { msg.className = "msg error"; msg.textContent = r.data.error || "The password could not be saved right now."; return; }
    try { sessionStorage.removeItem("rsg_reset"); } catch (err) {}
    saveSession(r.data);
    msg.className = "msg ok"; msg.textContent = "Your password has been changed. Logging you in…";
    setTimeout(() => { location.href = r.data.is_admin ? "/admin" : "/account"; }, 900);
};
</script>
</body>
</html>
