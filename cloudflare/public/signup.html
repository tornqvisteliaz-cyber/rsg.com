<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up | Rotaidem</title>
    <meta name="description" content="Create a Rotaidem account.">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/rwKST91B/rsgsoftware.png">
    <link rel="stylesheet" href="/site.css">
</head>
<body data-footer="off">
<main class="auth-page">
    <form class="auth-card" id="signup-form">
        <span class="eyebrow">Join the crew</span>
        <h1 class="title-lg" style="font-size:36px">Create account</h1>
        <div class="field"><label for="name">Name</label><input id="name" required></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required></div>
        <label style="text-transform:none;letter-spacing:0;font-weight:500;display:flex;gap:8px;align-items:center;margin:8px 0 18px"><input id="terms" type="checkbox"> I agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a></label>
        <button class="btn btn-block">Create account</button>
        <p id="error" class="msg"></p>
        <p class="muted" style="font-size:14px">Already have an account? <a href="/login">Log in</a></p>
    </form>
</main>
<script src="/auth.js"></script>
<script>
document.getElementById("signup-form").onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById("error");
    if (!document.getElementById("terms").checked) { msg.className = "msg error"; msg.textContent = "Accept the terms first."; return; }
    const res = await fetch("/api/signup", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: document.getElementById("name").value, email: document.getElementById("email").value, password: document.getElementById("password").value }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { msg.className = "msg error"; msg.textContent = data.error || "Could not sign up"; return; }
    saveSession(data);
    location.href = "/account";
};
</script>
</body>
</html>
