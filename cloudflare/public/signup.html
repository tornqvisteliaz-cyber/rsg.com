<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Rotaidem</title>
    <meta name="description" content="Create account to your Rotaidem account.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/site.css">
</head>
<body data-footer="off">
<main class="auth">
    <div class="auth-side" style="background-image:url('https://i.postimg.cc/28WybSM2/metroliner.jpg')"><div><h2>Join Rotaidem</h2><p>Get release news first and keep all your licences in one place.</p></div></div>
    <div class="auth-form">
        <form id="form">
            <h1 style="font-size:32px">Create your account</h1>
            <p class="muted" style="margin-bottom:26px">It is free and takes less than a minute.</p>
            <div class="field"><label for="name">Name</label><input id="name" autocomplete="name" required></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
            <div class="field"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><span class="muted" style="font-size:13px">At least 6 characters</span></div>
            <label style="font-weight:400;display:flex;gap:8px;align-items:center;margin:4px 0 20px"><input id="terms" type="checkbox"> I agree to the <a href="/terms">terms</a> and <a href="/privacy">privacy policy</a></label>
            <button class="btn btn-block">Create account</button>
            <p id="error" class="msg"></p>
            <p class="alt-link">Already have an account? <a href="/login">Log in</a></p>
        </form>
    </div>
</main>
<script src="/auth.js"></script>
<script>
const $ = id => document.getElementById(id);
$("form").onsubmit = async e => {
    e.preventDefault();
    const msg = $("error");
    if (!$("terms").checked) { msg.className = "msg error"; msg.textContent = "Please accept the terms first."; return; }
    const res = await fetch("/api/signup", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: $("name").value, email: $("email").value, password: $("password").value }) }).catch(() => null);
    const data = res ? await res.json().catch(() => ({})) : {};
    if (!res || !res.ok) { msg.className = "msg error"; msg.textContent = data.error || "Sign-up is not available right now."; return; }
    saveSession(data);
    location.href = "/account";
};
</script>
</body>
</html>
