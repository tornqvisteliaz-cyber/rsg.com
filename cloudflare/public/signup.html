<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up | RSG Software</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container" style="max-width: 460px; margin-top: 80px;">
    <div class="card shadow"><div class="card-body p-4">
        <h3 class="text-center">Sign up</h3>
        <input id="name" class="form-control mb-3" placeholder="Name">
        <input id="email" class="form-control mb-3" placeholder="Email">
        <input id="password" type="password" class="form-control mb-3" placeholder="Password">
        <label class="small"><input id="terms" type="checkbox"> I agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a></label>
        <button class="btn btn-dark btn-block mt-3" onclick="signup()">Create account</button>
        <p id="error" class="text-danger mt-3"></p>
        <a href="/login">Already have an account?</a>
    </div></div>
</div>
<script>
async function signup() {
    const error = document.getElementById('error');
    if (!document.getElementById('terms').checked) { error.textContent = 'Accept the terms first.'; return; }
    const res = await fetch('/api/signup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    })});
    const data = await res.json();
    if (!res.ok) { error.textContent = data.error || 'Could not sign up'; return; }
    localStorage.setItem('rsg_token', data.token);
    localStorage.setItem('rsg_name', data.name || '');
    localStorage.setItem('rsg_admin', 'false');
    location.href = '/account';
}
</script>
</body>
</html>
