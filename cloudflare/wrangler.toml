name = "rsg-com"
compatibility_date = "2026-10-05"
pages_build_output_dir = "./public"

# Custom Domain routes for rotaidem.com
routes = [
  { pattern = "rotaidem.com/*", zone_name = "rotaidem.com", custom_domain = true },
  { pattern = "www.rotaidem.com/*", zone_name = "rotaidem.com", custom_domain = true }
]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "rsg"
database_id = "replace-with-your-d1-database-id"

[vars]
ADMIN_USERNAME = "eliaz"
ADMIN_EMAIL = "admin@rsgsoftware.com"
RSG_DEV_UNLOCK = "false"
